<h1>ОБНОВЛЕНИЕ 999</h1>
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Остекление фасадов под ключ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Остекление фасадов под ключ</h1>
  <p>Бесплатный замер за 24 часа</p>
  <a href="#contact" class="btn">Оставить заявку</a>
</header>

<section>
  <h2>Наши услуги</h2>
  <div class="services">
    <div class="card">
      <h3>Монтаж фасадов</h3>
      <p>Алюминиевые конструкции любой сложности</p>
      <p><strong>Срок: от 5 дней</strong></p>
      <a href="#contact" class="btn">Рассчитать</a>
    </div>
  </div>
</section>

<section id="contact">
  <h2>Оставить заявку</h2>
  <form action="https://formspree.io/f/your-id" method="POST">
    <input type="text" name="name" placeholder="Ваше имя" required>
    <input type="tel" name="phone" placeholder="Телефон" required>
    <button type="submit">Отправить</button>
  </form>
</section>

<footer>
  <p>ООО ЭРИГЕР</p>
</footer>

</body>
</html>
